  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <text x="70" y="92" fill="#8faac4" font-family="system-ui,sans-serif" font-size="18" letter-spacing="4">ABYSS APPLIED · EVIDENCE-LED AGENT</text>
